name: build-app

# JS 测试 + 类型检查 + AMR 打包；native .so 复用 build-native 的 artifact。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  native:
    uses: ./.github/workflows/build-native.yml

  app:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        env:
          # PACKAGES_TOKEN = 有 read:packages 权限的 PAT（@penosext 私有包）；
          # fork PR 无 secret 时回退到内置 GITHUB_TOKEN（可能无权拉包 -> 失败可见）
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Fetch native .so
        uses: actions/download-artifact@v4
        with:
          name: libjsapi_mtdevice-aarch64
          path: libs

      - name: Build AMR
        run: pnpm build

      - name: Package check + checksum
        run: |
          AMR=$(find . -maxdepth 1 -name '*.amr' | head -1)
          test -n "$AMR" || { echo "::error::no AMR produced"; exit 1; }
          echo "AMR=$AMR" >> "$GITHUB_ENV"
          unzip -l "$AMR" | tee unpack.log
          grep -q 'libs/libjsapi_mtdevice.so' unpack.log || { echo "::error::native .so missing from AMR"; exit 1; }
          grep -q 'manifest.json' unpack.log || { echo "::error::manifest missing"; exit 1; }
          sha256sum "$AMR" | tee amr.sha256

      - name: Upload AMR
        uses: actions/upload-artifact@v4
        with:
          name: meituan-amr
          path: |
            ${{ env.AMR }}
            amr.sha256
          if-no-files-found: error
