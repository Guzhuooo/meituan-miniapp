name: build-native

# 交叉编译 native JSAPI 模块（目标: aarch64 glibc 2.36, GLIBCXX<=3.4.29）
# 产物 .so 上传为 artifact，由 build-app 打进 AMR。
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  mtdevice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          if sudo apt-get install -y --no-install-recommends gcc-12-aarch64-linux-gnu g++-12-aarch64-linux-gnu; then
            echo "CROSS_C_COMPILER=aarch64-linux-gnu-gcc-12" >> "$GITHUB_ENV"
            echo "CROSS_CXX_COMPILER=aarch64-linux-gnu-g++-12" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CROSS_C_COMPILER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "CROSS_CXX_COMPILER=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        working-directory: native/mtdevice
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: native/mtdevice
        run: cmake --build build -j"$(nproc)"

      - name: ELF checks (arch / deps / export / GLIBCXX)
        run: |
          SO=native/mtdevice/build/libjsapi_mtdevice.so
          file "$SO"
          file "$SO" | grep -q 'ARM aarch64'
          test "$(readelf -h "$SO" | awk '/Machine:/{print $NF}')" = AArch64
          # 依赖不得超出设备已有库集合（ld-linux-aarch64.so.1 为设备自带动态加载器）
          ALLOWED='libc\.so\.6|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|ld-linux-aarch64\.so\.1'
          if readelf -d "$SO" | grep NEEDED | grep -vE "$ALLOWED"; then
            echo "::error::unexpected NEEDED libraries"; exit 1
          fi
          nm -D "$SO" | grep -q custom_init_jsapis
          # GLIBCXX 符号版本上限 <= 3.4.29（设备 libstdc++ 6.0.29）
          MAXGLB=$(strings "$SO" | grep -oE 'GLIBCXX_3\.4\.[0-9]+' | sort -uV | tail -1 || true)
          echo "max GLIBCXX = ${MAXGLB:-none}"
          if [ -n "$MAXGLB" ] && [ "$(echo "$MAXGLB" | awk -F. '{print $3}')" -gt 29 ]; then
            echo "::error::GLIBCXX too new for device"; exit 1
          fi

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libjsapi_mtdevice-aarch64
          path: native/mtdevice/build/libjsapi_mtdevice.so
          if-no-files-found: error
