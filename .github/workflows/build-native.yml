name: build-native

# 交叉编译 native JSAPI 模块（目标: aarch64 glibc 2.36, GLIBCXX<=3.4.29）
# 产物 .so 上传为 artifact，由 build-app 打进 AMR。
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  mtdevice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12-aarch64-linux-gnu gcc-12-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Configure
        working-directory: native/mtdevice
        env:
          CROSS_C_COMPILER: aarch64-linux-gnu-gcc-12
          CROSS_CXX_COMPILER: aarch64-linux-gnu-g++-12
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: native/mtdevice
        run: cmake --build build -j"$(nproc)"

      - name: ELF checks (arch / interpreter / deps / export)
        run: |
          SO=native/mtdevice/build/libjsapi_mtdevice.so
          file "$SO" | tee /dev/stderr | grep -q 'ARM aarch64'
          test "$(readelf -h "$SO" | awk '/Machine:/{print $NF}')" = AArch64
          # 共享库无 INTERP 段；依赖不得超出设备已有库集合
          readelf -d "$SO" | tee /dev/stderr | grep NEEDED | grep -vE 'libc\.so\.6|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1' && exit 1 || true
          nm -D "$SO" | grep -q custom_init_jsapis
          # GLIBCXX 符号版本上限 ≤ 3.4.29（设备 libstdc++ 6.0.29）
          MAXGLB=$(strings "$SO" | grep -oE 'GLIBCXX_3\.4\.[0-9]+' | sort -uV | tail -1)
          echo "max GLIBCXX = $MAXGLB"
          [ "$(echo "$MAXGLB" | awk -F. '{print $3}')" -le 29 ] || { echo "GLIBCXX too new for device"; exit 1; }

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libjsapi_mtdevice-aarch64
          path: native/mtdevice/build/libjsapi_mtdevice.so
          if-no-files-found: error
